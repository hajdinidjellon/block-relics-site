<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Block Relics — Download</title>
<meta name="description" content="Block Relics: a block puzzle game with relics, TNT and rockets. Free on iPhone and Android." />
<meta property="og:title" content="Block Relics — free block puzzle" />
<meta property="og:description" content="Free on iPhone and Android. Plays offline." />
<!--
  Lien unique de la bio TikTok / Instagram : envoie chaque téléphone vers le bon store
  en gardant la source pour les stats (App Store : ct=<source>-bio ; Play : referrer utm).
  ?s=tiktok | instagram | youtube … (lettres, chiffres, tirets). Aucun traceur sur cette page.
-->
<style>
  :root { --cream:#f2e1c9; --ink:#232836; --navy:#1b2539; --gold:#f5b826; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--navy); color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; text-align:center; }
  .card { padding:32px 22px; max-width:360px; }
  h1 { font-size:28px; margin:0 0 6px; }
  p { margin:0 0 24px; opacity:.8; }
  a.btn { display:block; margin:12px 0; padding:15px 18px; border-radius:14px; font-weight:700; font-size:17px;
    text-decoration:none; background:var(--gold); color:var(--ink); border:3px solid var(--ink); box-shadow:0 5px 0 #000; }
  a.btn.alt { background:var(--cream); }
</style>
</head>
<body>
<div class="card">
  <h1>Block Relics</h1>
  <p>Free block puzzle · plays offline</p>
  <a class="btn" id="ios" href="https://apps.apple.com/app/apple-store/id6794807428?pt=129223115&ct=site-play&mt=8">Download on the App Store</a>
  <a class="btn alt" id="android" href="https://play.google.com/store/apps/details?id=com.dzmobile.blockrelics&referrer=utm_source%3Dsite%26utm_medium%3Dplay">Get it on Google Play</a>
</div>
<script>
  (function () {
    var s = (new URLSearchParams(location.search).get('s') || 'site').toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 30) || 'site';
    var medium = s === 'site' ? 'play' : 'bio';
    var ios = 'https://apps.apple.com/app/apple-store/id6794807428?pt=129223115&ct=' + s + '-' + medium + '&mt=8';
    var android = 'https://play.google.com/store/apps/details?id=com.dzmobile.blockrelics&referrer=' +
      encodeURIComponent('utm_source=' + s + '&utm_medium=' + medium);
    document.getElementById('ios').href = ios;
    document.getElementById('android').href = android;
    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (isIOS) location.replace(ios);
    else if (/Android/i.test(ua)) location.replace(android);
  })();
</script>
</body>
</html>
